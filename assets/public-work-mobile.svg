<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc">
  <title id="title">Public ACRN Hypervisor work</title>
  <desc id="desc">Mobile layout of eight merged pull requests to the ACRN Hypervisor and three representative changes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071012"/><stop offset=".6" stop-color="#0b1719"/><stop offset="1" stop-color="#11142a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79f2c0"/><stop offset=".55" stop-color="#69d7e8"/><stop offset="1" stop-color="#b8a2ff"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#a8ffda" stroke-opacity=".045"/></pattern>
    <style>.sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}</style>
  </defs>
  <rect width="720" height="650" rx="28" fill="url(#bg)"/><rect width="720" height="650" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="718" height="648" rx="27" fill="none" stroke="#79f2c0" stroke-opacity=".24"/>
  <text class="mono" x="36" y="51" fill="#79f2c0" font-size="22" letter-spacing="2">PUBLIC EVIDENCE / ACRN HYPERVISOR</text>
  <text class="sans" x="36" y="94" fill="#e8fff5" font-size="30" font-weight="750">8 merged pull requests</text>
  <text class="sans" x="36" y="126" fill="#9bb6ad" font-size="22">Code quality and maintainability</text>

  <g transform="translate(36 158)">
    <rect width="648" height="116" rx="20" fill="#102a26" stroke="#79f2c0" stroke-opacity=".42"/>
    <text class="sans" x="28" y="77" fill="url(#accent)" font-size="70" font-weight="800">8</text>
    <text class="mono" x="122" y="52" fill="#a8ffda" font-size="22">MERGED</text>
    <text class="sans" x="122" y="82" fill="#e8fff5" font-size="25" font-weight="700">pull requests</text>
  </g>

  <g transform="translate(36 294)">
    <rect width="648" height="282" rx="20" fill="#0d1b1d" stroke="#a8ffda" stroke-opacity=".18"/>
    <circle cx="28" cy="52" r="7" fill="#79f2c0"/><text class="mono" x="48" y="58" fill="#79f2c0" font-size="22">#3342</text>
    <text class="sans" x="48" y="91" fill="#e8fff5" font-size="22" font-weight="650">vCPU cleanup for static analysis</text>
    <path d="M28 116H620" stroke="#a8ffda" stroke-opacity=".12"/>
    <circle cx="28" cy="150" r="7" fill="#69d7e8"/><text class="mono" x="48" y="156" fill="#69d7e8" font-size="22">#3373</text>
    <text class="sans" x="48" y="189" fill="#e8fff5" font-size="22" font-weight="650">dead instruction-emulation code removal</text>
    <path d="M28 214H620" stroke="#a8ffda" stroke-opacity=".12"/>
    <circle cx="28" cy="248" r="7" fill="#b8a2ff"/><text class="mono" x="48" y="254" fill="#b8a2ff" font-size="22">#3580</text>
    <text class="sans" x="166" y="254" fill="#e8fff5" font-size="22" font-weight="650">coding-guideline fixes</text>
  </g>
</svg>
