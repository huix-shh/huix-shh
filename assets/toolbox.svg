    <text class="sans" x="25" y="60" fill="#e8fff5" font-size="16" font-weight="650">Linux · KVM · QEMU · libvirt · Firecracker</text>
    <text class="mono" x="25" y="79" fill="#8faeb5" font-size="16">cloud-init · systemd</text>
  </g>
  <g transform="translate(746 217)">
    <rect width="402" height="91" rx="18" fill="#241b3d" stroke="#b8a2ff" stroke-opacity=".34"/>
    <text class="mono" x="25" y="27" fill="#b8a2ff" font-size="16" letter-spacing="1.6">CLOUD NATIVE</text>
    <text class="sans" x="25" y="60" fill="#f0edff" font-size="16" font-weight="650">Kubernetes · containerd · runc</text>
    <text class="mono" x="25" y="79" fill="#aaa2c2" font-size="16">Ansible</text>
