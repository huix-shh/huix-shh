<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img" aria-labelledby="title desc">
  <title id="title">Systems engineering toolbox</title>
  <desc id="desc">Mobile layout of languages, Linux systems, virtualization, and cloud-native tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071012"/><stop offset=".58" stop-color="#0a1819"/><stop offset="1" stop-color="#11142a"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#a8ffda" stroke-opacity=".045"/></pattern>
    <style>.sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}</style>
  </defs>
  <rect width="720" height="660" rx="28" fill="url(#bg)"/><rect width="720" height="660" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="718" height="658" rx="27" fill="none" stroke="#79f2c0" stroke-opacity=".24"/>
  <text class="mono" x="36" y="51" fill="#79f2c0" font-size="22" letter-spacing="2">TOOLBOX / WORKING SET</text>
  <text class="sans" x="36" y="94" fill="#e8fff5" font-size="30" font-weight="750">Tools used across the stack</text>

  <g transform="translate(36 128)">
    <rect width="648" height="118" rx="20" fill="#102a26" stroke="#79f2c0" stroke-opacity=".36"/>
    <text class="mono" x="28" y="34" fill="#79f2c0" font-size="22" letter-spacing="1.5">CODE</text>
    <text class="sans" x="28" y="78" fill="#e8fff5" font-size="25" font-weight="700">C · Python · Go · Bash</text>
  </g>
  <g transform="translate(36 266)">
    <rect width="648" height="166" rx="20" fill="#10262d" stroke="#69d7e8" stroke-opacity=".36"/>
    <text class="mono" x="28" y="36" fill="#69d7e8" font-size="22" letter-spacing="1.5">SYSTEMS + VIRTUALIZATION</text>
    <text class="sans" x="28" y="80" fill="#e8fff5" font-size="23" font-weight="700">Linux · KVM · QEMU · libvirt</text>
    <text class="sans" x="28" y="115" fill="#e8fff5" font-size="23" font-weight="700">Firecracker</text>
    <text class="mono" x="28" y="144" fill="#8faeb5" font-size="22">cloud-init · systemd</text>
  </g>
  <g transform="translate(36 452)">
    <rect width="648" height="150" rx="20" fill="#241b3d" stroke="#b8a2ff" stroke-opacity=".36"/>
    <text class="mono" x="28" y="36" fill="#b8a2ff" font-size="22" letter-spacing="1.5">CLOUD NATIVE</text>
    <text class="sans" x="28" y="80" fill="#f0edff" font-size="23" font-weight="700">Kubernetes · containerd · runc</text>
    <text class="mono" x="28" y="118" fill="#aaa2c2" font-size="22">Ansible</text>
  </g>
</svg>
