<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">huix-shh — systems work made visible</title>
  <desc id="desc">A mobile system cutaway showing Linux Systems, Virtualization, Cloud Native, and a Vibe Coding build, review, and verify workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071012"/><stop offset=".55" stop-color="#0a1819"/><stop offset="1" stop-color="#11142a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79f2c0"/><stop offset=".55" stop-color="#69d7e8"/><stop offset="1" stop-color="#b8a2ff"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#a8ffda" stroke-opacity=".055"/></pattern>
    <style>.sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}</style>
  </defs>
  <rect width="720" height="720" rx="28" fill="url(#bg)"/><rect width="720" height="720" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="718" height="718" rx="27" fill="none" stroke="#79f2c0" stroke-opacity=".26"/>
  <text class="mono" x="42" y="52" fill="#79f2c0" font-size="22" letter-spacing="2">SYSTEMS ENGINEER</text>
  <text class="sans" x="42" y="122" fill="#e8fff5" font-size="54" font-weight="780">SYSTEMS WORK,</text>
  <text class="sans" x="42" y="179" fill="url(#accent)" font-size="54" font-weight="780">MADE VISIBLE.</text>
  <g class="mono" font-size="22" font-weight="700" transform="translate(42 210)">
    <rect width="126" height="40" rx="12" fill="#102a26" stroke="#79f2c0" stroke-opacity=".45"/><text x="63" y="26" fill="#a8ffda" text-anchor="middle">LINUX</text>
    <rect x="138" width="186" height="40" rx="12" fill="#10262d" stroke="#69d7e8" stroke-opacity=".45"/><text x="231" y="26" fill="#9ce9f3" text-anchor="middle">VIRTUALIZATION</text>
    <rect x="336" width="166" height="40" rx="12" fill="#241b3d" stroke="#b8a2ff" stroke-opacity=".45"/><text x="419" y="26" fill="#d0c4ff" text-anchor="middle">CLOUD NATIVE</text>
  </g>
  <text class="mono" x="42" y="300" fill="#80a198" font-size="22" letter-spacing="2">SYSTEM CUTAWAY</text>
  <g transform="translate(42 324)">
    <rect width="636" height="82" rx="16" fill="#241b3d" stroke="#b8a2ff" stroke-opacity=".5"/>
    <text class="mono" x="20" y="31" fill="#b8a2ff" font-size="22">L3</text><text class="sans" x="68" y="34" fill="#f0edff" font-size="25" font-weight="700">Cloud Native</text><text class="mono" x="68" y="62" fill="#aaa2c2" font-size="22">Kubernetes · runtimes · edge</text>
    <rect y="94" width="636" height="82" rx="16" fill="#10262d" stroke="#69d7e8" stroke-opacity=".5"/>
    <text class="mono" x="20" y="125" fill="#69d7e8" font-size="22">L2</text><text class="sans" x="68" y="128" fill="#e9fbff" font-size="25" font-weight="700">Virtualization</text><text class="mono" x="68" y="156" fill="#93b2b8" font-size="22">KVM · QEMU · libvirt · ACRN</text>
    <rect y="188" width="636" height="82" rx="16" fill="#102a26" stroke="#79f2c0" stroke-opacity=".5"/>
    <text class="mono" x="20" y="219" fill="#79f2c0" font-size="22">L1</text><text class="sans" x="68" y="222" fill="#ebfff6" font-size="25" font-weight="700">Linux Systems</text><text class="mono" x="68" y="250" fill="#91afa5" font-size="22">code · automation · I/O</text>
  </g>
  <g transform="translate(42 620)">
    <rect width="636" height="58" rx="16" fill="#171920" stroke="#ffc978" stroke-opacity=".4"/>
    <text class="mono" x="20" y="35" fill="#ffc978" font-size="22" font-weight="700">VIBE CODING</text>
    <text class="mono" x="596" y="35" fill="#d8c7a4" font-size="22" text-anchor="end">BUILD · REVIEW · VERIFY</text>
