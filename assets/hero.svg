<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">huix-shh — Systems, Virtualization, AI Infrastructure</title>
  <desc id="desc">Animated dark technical banner with a circuit grid, performance traces, and cyan-violet gradients.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.48" stop-color="#071b31"/>
      <stop offset="1" stop-color="#120b2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7dd3fc" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect x="24" y="24" width="1152" height="312" rx="26"/>
    </clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .pulse-late { animation: pulse 2.8s 1.15s ease-in-out infinite; transform-origin: center; }
      .dash { stroke-dasharray: 9 14; animation: dash 11s linear infinite; }
      .scan { animation: scan 7s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes dash { to { stroke-dashoffset: -230; } }
      @keyframes scan { 0%, 100% { transform: translateX(-280px); opacity: 0; } 18%, 82% { opacity: .55; } 50% { transform: translateX(1200px); } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .pulse-late, .dash, .scan { animation: none; }
        .pulse, .pulse-late { opacity: .75; }
        .scan { opacity: 0; transform: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" fill="#020617"/>
  <rect x="24" y="24" width="1152" height="312" rx="26" fill="url(#background)" stroke="#38bdf8" stroke-opacity="0.28"/>

  <g clip-path="url(#panelClip)">
    <rect x="24" y="24" width="1152" height="312" fill="url(#grid)"/>
    <ellipse cx="190" cy="78" rx="330" ry="250" fill="url(#glowCyan)"/>
    <ellipse cx="1040" cy="312" rx="350" ry="260" fill="url(#glowViolet)"/>

    <path class="dash" d="M24 273 C210 195 305 335 480 247 S760 144 932 226 1090 286 1176 201" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.62"/>
    <path d="M24 290 C245 240 316 318 498 271 S786 200 924 259 1080 302 1176 247" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.18"/>

    <g transform="translate(902 66)" fill="none" stroke="#67e8f9" stroke-opacity="0.62">
      <path d="M0 38 H62 V0 H132"/>
      <path d="M28 78 H96 V42 H188"/>
      <path d="M0 118 H52 V158 H174"/>
      <path d="M70 118 H118 V92 H212"/>
      <circle class="pulse" cx="0" cy="38" r="4" fill="#22d3ee" stroke="none"/>
      <circle class="pulse-late" cx="132" cy="0" r="4" fill="#a78bfa" stroke="none"/>
      <circle class="pulse" cx="188" cy="42" r="4" fill="#38bdf8" stroke="none"/>
      <circle class="pulse-late" cx="174" cy="158" r="4" fill="#22d3ee" stroke="none"/>
      <circle class="pulse" cx="212" cy="92" r="4" fill="#a78bfa" stroke="none"/>
    </g>

    <rect class="scan" x="0" y="24" width="170" height="312" fill="url(#glowCyan)" opacity="0.35"/>
  </g>

  <g transform="translate(82 83)">
    <g class="mono" font-size="14" letter-spacing="2.2" fill="#7dd3fc">
      <circle cx="6" cy="-5" r="5" fill="#22d3ee" filter="url(#softGlow)"/>
      <text x="22" y="0">SYSTEM STATUS: BUILDING</text>
    </g>

    <text class="sans" x="0" y="78" fill="#f8fafc" font-size="57" font-weight="760" letter-spacing="1">HUIX-SHH</text>
    <rect x="0" y="97" width="635" height="4" rx="2" fill="url(#accent)"/>
    <text class="mono" x="0" y="139" fill="#cbd5e1" font-size="19" letter-spacing="1.6">SYSTEMS · VIRTUALIZATION · AI INFRA</text>

    <g class="mono" font-size="13" font-weight="600" letter-spacing="1">
      <g transform="translate(0 174)">
        <rect width="160" height="34" rx="17" fill="#082f49" stroke="#22d3ee" stroke-opacity="0.72"/>
        <text x="80" y="22" fill="#67e8f9" text-anchor="middle">KVM / QEMU</text>
      </g>
      <g transform="translate(174 174)">
        <rect width="174" height="34" rx="17" fill="#172554" stroke="#38bdf8" stroke-opacity="0.72"/>
        <text x="87" y="22" fill="#7dd3fc" text-anchor="middle">PERFORMANCE</text>
      </g>
      <g transform="translate(362 174)">
        <rect width="188" height="34" rx="17" fill="#2e1065" stroke="#a78bfa" stroke-opacity="0.72"/>
        <text x="94" y="22" fill="#c4b5fd" text-anchor="middle">C · PYTHON · GO</text>
      </g>
    </g>
  </g>

  <g class="mono" transform="translate(1008 284)" font-size="12" fill="#94a3b8" text-anchor="end">
    <text x="100" y="0">OPEN TO · YANGTZE RIVER DELTA</text>
    <text x="100" y="22" fill="#67e8f9">10+ YEARS IN SYSTEMS</text>
  </g>
</svg>
