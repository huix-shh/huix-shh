<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">huix-shh — systems work made visible</title>
  <desc id="desc">A system cutaway showing Linux Systems, Virtualization, and Cloud Native layers beside a Vibe Coding build, review, and verify workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071012"/>
      <stop offset="0.55" stop-color="#0a1819"/>
      <stop offset="1" stop-color="#11142a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79f2c0"/>
      <stop offset="0.55" stop-color="#69d7e8"/>
      <stop offset="1" stop-color="#b8a2ff"/>
    </linearGradient>
    <linearGradient id="slab1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#102a26"/><stop offset="1" stop-color="#0e2023"/></linearGradient>
    <linearGradient id="slab2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10262d"/><stop offset="1" stop-color="#121e34"/></linearGradient>
    <linearGradient id="slab3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#182139"/><stop offset="1" stop-color="#241b3d"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#a8ffda" stroke-opacity=".055"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="20" y="20" width="1160" height="380" rx="26"/></clipPath>
    <style>
      .sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}
      .signal{stroke-dasharray:7 11;animation:signal 9s linear infinite}.pulse{animation:pulse 2.6s ease-in-out infinite}.pulse2{animation:pulse 2.6s 1.1s ease-in-out infinite}
      @keyframes signal{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.signal,.pulse,.pulse2{animation:none}.pulse,.pulse2{opacity:.8}}
    </style>
  </defs>
  <rect width="1200" height="420" fill="#041012"/>
  <rect x="20" y="20" width="1160" height="380" rx="26" fill="url(#bg)" stroke="#79f2c0" stroke-opacity=".25"/>
  <g clip-path="url(#clip)">
    <rect x="20" y="20" width="1160" height="380" fill="url(#grid)"/>
    <circle cx="1050" cy="30" r="260" fill="#69d7e8" opacity=".045"/>
    <circle cx="310" cy="420" r="300" fill="#79f2c0" opacity=".035"/>
  </g>
  <g transform="translate(68 58)">
    <circle class="pulse" cx="5" cy="-4" r="5" fill="#79f2c0" filter="url(#glow)"/>
    <text class="mono" x="22" y="0" fill="#79f2c0" font-size="13" letter-spacing="2">SYSTEMS ENGINEER</text>
    <text class="sans" x="0" y="70" fill="#e8fff5" font-size="48" font-weight="750" letter-spacing="-1.8">SYSTEMS WORK,</text>
    <text class="sans" x="0" y="122" fill="url(#accent)" font-size="48" font-weight="750" letter-spacing="-1.8">MADE VISIBLE.</text>
    <text class="mono" x="0" y="165" fill="#9bb6ad" font-size="14" letter-spacing="1.3">HUIX-SHH / BUILD · REVIEW · VERIFY</text>
    <g transform="translate(0 205)" class="mono" font-size="12" font-weight="700">
      <rect width="130" height="31" rx="8" fill="#102a26" stroke="#79f2c0" stroke-opacity=".45"/><text x="65" y="20" fill="#a8ffda" text-anchor="middle">LINUX</text>
      <rect x="142" width="164" height="31" rx="8" fill="#10262d" stroke="#69d7e8" stroke-opacity=".45"/><text x="224" y="20" fill="#9ce9f3" text-anchor="middle">VIRTUALIZATION</text>
      <rect x="318" width="150" height="31" rx="8" fill="#241b3d" stroke="#b8a2ff" stroke-opacity=".45"/><text x="393" y="20" fill="#d0c4ff" text-anchor="middle">CLOUD NATIVE</text>
    </g>
  </g>
  <g transform="translate(610 61)">
    <text class="mono" x="0" y="0" fill="#80a198" font-size="11" letter-spacing="2">SYSTEM CUTAWAY</text>
    <g transform="translate(0 20)">
      <rect x="0" y="0" width="360" height="66" rx="13" fill="url(#slab3)" stroke="#b8a2ff" stroke-opacity=".5"/>
      <text class="mono" x="18" y="26" fill="#b8a2ff" font-size="11">L3</text><text class="sans" x="54" y="27" fill="#f0edff" font-size="18" font-weight="700">Cloud Native</text><text class="mono" x="54" y="48" fill="#aaa2c2" font-size="11">Kubernetes · runtimes · edge</text>
      <rect x="0" y="76" width="360" height="66" rx="13" fill="url(#slab2)" stroke="#69d7e8" stroke-opacity=".5"/>
      <text class="mono" x="18" y="102" fill="#69d7e8" font-size="11">L2</text><text class="sans" x="54" y="103" fill="#e9fbff" font-size="18" font-weight="700">Virtualization</text><text class="mono" x="54" y="124" fill="#93b2b8" font-size="11">KVM · QEMU · libvirt · ACRN</text>
      <rect x="0" y="152" width="360" height="66" rx="13" fill="url(#slab1)" stroke="#79f2c0" stroke-opacity=".5"/>
      <text class="mono" x="18" y="178" fill="#79f2c0" font-size="11">L1</text><text class="sans" x="54" y="179" fill="#ebfff6" font-size="18" font-weight="700">Linux Systems</text><text class="mono" x="54" y="200" fill="#91afa5" font-size="11">code · automation · I/O</text>
      <rect x="0" y="230" width="360" height="30" rx="8" fill="#0b1719" stroke="#a8ffda" stroke-opacity=".14"/>
      <text class="mono" x="180" y="249" fill="#708b82" font-size="10" letter-spacing="1.1" text-anchor="middle">CPU / GPU / STORAGE / NETWORK</text>
    </g>
    <g transform="translate(383 20)">
      <rect width="119" height="260" rx="16" fill="#0d1b1d" stroke="#ffc978" stroke-opacity=".45"/>
      <text class="mono" x="59.5" y="25" fill="#ffc978" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">VIBE CODING</text>
      <g class="mono" font-size="10" text-anchor="middle">
        <circle class="pulse" cx="59.5" cy="67" r="17" fill="#173127" stroke="#79f2c0"/><text x="59.5" y="71" fill="#a8ffda">BUILD</text>
        <path class="signal" d="M59.5 86V111" stroke="#ffc978"/>
        <circle class="pulse2" cx="59.5" cy="132" r="17" fill="#182732" stroke="#69d7e8"/><text x="59.5" y="136" fill="#9ce9f3">REVIEW</text>
        <path class="signal" d="M59.5 151V176" stroke="#ffc978"/>
        <circle class="pulse" cx="59.5" cy="197" r="17" fill="#291f35" stroke="#b8a2ff"/><text x="59.5" y="201" fill="#d0c4ff">VERIFY</text>
      </g>
      <text class="mono" x="59.5" y="238" fill="#806d4b" font-size="9" text-anchor="middle">HUMAN GATE</text>
    </g>
  </g>
</svg>
