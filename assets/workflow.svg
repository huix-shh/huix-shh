<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Coding, with a gate</title>
  <desc id="desc">Claude Code, Codex, and Kimi are followed by human code review and verification with automated tests, logs, and benchmarks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071012"/><stop offset=".58" stop-color="#0a1819"/><stop offset="1" stop-color="#17132a"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79f2c0"/><stop offset=".52" stop-color="#ffc978"/><stop offset="1" stop-color="#b8a2ff"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#a8ffda" stroke-opacity=".05"/></pattern>
    <style>.sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}</style>
  </defs>
  <rect width="1200" height="330" rx="26" fill="url(#bg)"/><rect width="1200" height="330" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="328" rx="25" fill="none" stroke="#79f2c0" stroke-opacity=".22"/>
  <text class="mono" x="52" y="53" fill="#ffc978" font-size="16" font-weight="700" letter-spacing="2">VIBE CODING, WITH A GATE</text>
  <path d="M350 194H430M770 194H850" fill="none" stroke="url(#flow)" stroke-width="3"/>
  <path d="m416 184 14 10-14 10M836 184l14 10-14 10" fill="none" stroke="#ffc978" stroke-width="3"/>
  <g transform="translate(52 102)">
    <rect width="298" height="184" rx="20" fill="#102a26" stroke="#79f2c0" stroke-opacity=".5"/>
    <circle cx="34" cy="34" r="15" fill="#79f2c0"/><path d="m28 34 4 4 8-9" fill="none" stroke="#071012" stroke-width="3"/>
    <text class="sans" x="24" y="94" fill="#e8fff5" font-size="24" font-weight="750">Claude Code / Codex / Kimi</text>
  </g>
  <g transform="translate(430 102)">
    <rect width="340" height="184" rx="20" fill="#231e24" stroke="#ffc978" stroke-opacity=".62"/>
    <circle cx="34" cy="34" r="15" fill="#ffc978"/><path d="M26 34h16M34 26v16" stroke="#151008" stroke-width="3"/>
    <text class="sans" x="24" y="90" fill="#fff7e8" font-size="24" font-weight="750">Human review:</text>
    <text class="mono" x="24" y="121" fill="#ffd997" font-size="16">code review</text>
  </g>
  <g transform="translate(850 102)">
    <rect width="298" height="184" rx="20" fill="#241b3d" stroke="#b8a2ff" stroke-opacity=".5"/>
    <circle cx="34" cy="34" r="15" fill="#b8a2ff"/><path d="m28 34 4 4 8-9" fill="none" stroke="#100c1c" stroke-width="3"/>
    <text class="sans" x="24" y="86" fill="#f0edff" font-size="24" font-weight="750">Verification:</text>
    <text class="mono" x="24" y="116" fill="#d0c4ff" font-size="16">automated tests · logs</text>
    <text class="mono" x="24" y="141" fill="#d0c4ff" font-size="16">· benchmarks</text>
  </g>
</svg>
